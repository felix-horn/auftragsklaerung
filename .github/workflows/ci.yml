# Runs the project's checks on GitHub's machines after every push, every
# night, and on demand: install, generated code, type check, unit tests,
# then one eval run (22 API calls, about 12.5 US cents) judged by the gate
# against evals/baseline/.
name: CI

on:
  push:
    # Every branch, but no tags: a tag push alone starts no run.
    branches: ["**"]
  schedule:
    # Every night at 03:17 UTC, on the newest commit of main. Catches changes
    # on Anthropic's side that come without a commit. Not on the full hour:
    # GitHub delays scheduled runs then, and under load drops some.
    - cron: "17 3 * * *"
  # Adds a "Run workflow" button in the Actions tab: a run without a push.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-latest
    # A hung run stops after 10 minutes instead of GitHub's default 6 hours.
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install dependencies
        run: npm ci

      # The Zod schemas in src/generated/ must be what orval generates from
      # the documents in contracts/ today. Fails, and shows the difference,
      # when a document was replaced without `npm run erp:generate` or a
      # generated file was edited by hand.
      - name: Generated code matches contracts/
        run: |
          npm run erp:generate
          git --no-pager diff -- src/generated/ mock-erp/generated/
          git status --short -- src/generated/ mock-erp/generated/
          test -z "$(git status --porcelain -- src/generated/ mock-erp/generated/)"

      - name: Type check
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Eval (one run, real API)
        run: npm run eval -- -o eval-result.json
        env:
          # Stored under Settings → Secrets and variables → Actions.
          # Only this step receives it.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # promptfoo would exit with 100 whenever an email has a wrong
          # check, which is every run. The gate step decides instead.
          PROMPTFOO_FAILED_TEST_EXIT_CODE: 0

      - name: Keep the eval result
        uses: actions/upload-artifact@v7
        with:
          path: eval-result.json
          archive: false

      - name: Gate
        run: npm run eval:gate -- eval-result.json
